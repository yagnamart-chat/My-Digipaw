name: Build Android APK

on:
  push:
    branches: [ "kt-rewrite" ] # Kyunki teri branch ka naam kt-rewrite hai
  pull_request:
    branches: [ "kt-rewrite" ]
  workflow_dispatch: # Isse tu manually bhi build button daba sakega

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DigiPaws-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
