name: Build Android APK

on:
  push:
    branches: [ "kt-rewrite" ]
  pull_request:
    branches: [ "kt-rewrite" ]
  workflow_dispatch:

# 🛡️ Only one build at a time (avoid conflicts)
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 🧠 Guard: ensure only this workflow runs this job
    if: github.workflow == 'Build Android APK'
    
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Debug Only)
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DigiPaws-Bulldog-APK
        path: app/build/outputs/apk/debug/app-debug.apk
